name: NEU Event Watcher — Daily evidence (no paid API)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-watch.yml'
      - 'scripts/**'
      - 'neu_event_watcher/**'
      - 'requirements.txt'
  schedule:
    - cron: '17 8 * * *'  # 15:17 in Vietnam (UTC+7)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neu-event-watcher-daily
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ordinary Scrapy (NOT Zyte API)
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Offline safety tests
        run: python -m unittest discover -s tests -v
      - name: Crawl one public event URL with robots obeyed
        run: python -m scripts.collect_once
      - name: Save run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neu-event-snapshot-${{ github.run_id }}
          path: out/latest.json
          retention-days: 14
          if-no-files-found: warn
      - name: Publish read-only JSON outside main branch
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.publish_snapshot
